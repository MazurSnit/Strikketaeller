<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ece6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d171d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strikketæller">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Strikketæller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: yarn-toned cards on a soft knit texture — header with yarn ball + theme toggle, Pind (hero), Mønstergentagelse, Masker, Noter. */
:root{
  --bg:#f3ece6; --knit:#e8ddd3; --card:#fffaf5; --fg:#3a2c35; --muted:#8a7682; --line:#eadfd6;
  --heather:#8c4f78; --heather-soft:#f1e2ea; --moss:#6f8c64; --honey:#d9a441; --plus-fg:#ffffff; --red:#b8483b;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 8px 24px -14px rgba(90,50,70,.35);
  --display:"Fraunces",Georgia,serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d171d; --knit:#251d25; --card:#2a222b; --fg:#f2e7ee; --muted:#b29fac; --line:#3a2f3a;
  --heather:#e3a0c6; --heather-soft:#3a2a37; --moss:#a5c296; --honey:#e9bb5c; --plus-fg:#2a1d27; --red:#e07a6c;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 28px -16px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d171d; --knit:#251d25; --card:#2a222b; --fg:#f2e7ee; --muted:#b29fac; --line:#3a2f3a;
  --heather:#e3a0c6; --heather-soft:#3a2a37; --moss:#a5c296; --honey:#e9bb5c; --plus-fg:#2a1d27; --red:#e07a6c;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 28px -16px rgba(0,0,0,.8); color-scheme:dark}

html,body{min-height:100%}
body{
  background-color:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;
  /* strikket "V"-mønster */
  background-image:
    linear-gradient(60deg, transparent 46%, var(--knit) 47%, var(--knit) 53%, transparent 54%),
    linear-gradient(-60deg, transparent 46%, var(--knit) 47%, var(--knit) 53%, transparent 54%);
  background-size:18px 22px;background-position:0 0,9px 0;
}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:14px 32px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
select,input,textarea,button{font:inherit;color:var(--fg)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--honey);outline-offset:2px}

/* Header */
.top{display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:600;font-size:26px;letter-spacing:-.01em;flex:1}
.yarn{width:34px;height:34px;flex:none}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.round svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round}

.bar{display:flex;gap:8px;align-items:center}
select{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-weight:700;box-shadow:var(--shadow)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--fg)}
.chip.yes{background:var(--red);border-color:var(--red);color:#fff}
.chip.ghost{background:transparent;color:var(--muted)}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:34px}
.head h2{margin:0;font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:600;font-size:20px;display:flex;align-items:center;gap:8px}
.head h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent,var(--heather))}
.card.pind{--accent:var(--heather);background:linear-gradient(180deg,var(--heather-soft),var(--card) 70%)}
.card.rep{--accent:var(--honey)}
.card.st{--accent:var(--moss)}
.card.notes{--accent:var(--muted)}

.count{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.n{font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:600;font-size:56px;line-height:1;font-variant-numeric:tabular-nums lining-nums;min-width:2.2ch;text-align:center}
.pind .n{font-size:76px;color:var(--heather)}
.minus,.plus{height:60px;border-radius:20px;font-size:28px;font-weight:800;cursor:pointer;touch-action:manipulation;user-select:none;transition:transform .08s}
.minus{border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.plus{border:0;background:var(--accent);color:var(--plus-fg);box-shadow:0 6px 14px -8px var(--accent)}
.minus:active,.plus:active{transform:scale(.95)}
.sure{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;flex-wrap:wrap}

.prog{display:flex;flex-direction:column;gap:12px}
.prog .txt{font-size:16px;color:var(--muted)}
.prog .txt strong{color:var(--fg);font-size:18px}
.stitches{display:flex;flex-wrap:wrap;gap:4px}
.stitch{width:18px;height:20px}
.stitch path{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.stitch.on path{stroke:var(--honey)}
.field{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px;flex-wrap:wrap}
.field input{width:64px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:center;font-weight:700}

textarea{width:100%;box-sizing:border-box;min-height:90px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--bg);resize:vertical;line-height:1.5}
.confirm{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.confirm p{margin:0;font-weight:700}
.confirm input{padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;font-weight:800;cursor:pointer}
.btn.go{background:var(--heather);border-color:var(--heather);color:var(--plus-fg)}
.btn.yes{background:var(--red);border-color:var(--red);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){.minus,.plus{transition:none}.minus:active,.plus:active{transform:none}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <svg class="yarn" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="18" cy="20" r="14" fill="var(--heather)"/>
      <path d="M7 14c6 2 16 2 23 0M5 21c8 3 18 3 26 0M8 28c6 2 14 2 20 0M13 8c-3 7-3 17 1 25M22 7c4 8 4 18-1 26" fill="none" stroke="var(--card)" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
      <path d="M30 28c4 2 6 5 5 9" fill="none" stroke="var(--heather)" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>Strikketæller</h1>
    <button class="round" id="themeBtn" aria-label="Skift mellem lyst og mørkt tema">
      <svg id="themeIcon" viewBox="0 0 24 24"></svg>
    </button>
  </header>

  <div class="bar">
    <select id="proj" aria-label="Projekt"></select>
    <button class="chip" id="newBtn">+ Nyt</button>
  </div>
  <div class="confirm" id="newBox" hidden>
    <p>Nyt projekt</p>
    <input id="newName" placeholder="F.eks. Sweater til Ida">
    <div class="row2"><button class="btn" id="newCancel">Annuller</button><button class="btn go" id="newOk">Opret</button></div>
  </div>

  <section class="card pind">
    <div class="head">
      <h2>Pind</h2>
      <button class="chip ghost" id="resetBtn">Nulstil</button>
    </div>
    <div class="sure" id="resetBox" hidden>
      <span>Sikker?</span>
      <button class="chip" id="resetNo">Nej</button>
      <button class="chip yes" id="resetYes">Ja, nulstil</button>
    </div>
    <div class="count">
      <button class="minus" id="rowMinus" aria-label="Én pind mindre">−</button>
      <span class="n" id="rows">0</span>
      <button class="plus" id="rowPlus" aria-label="Én pind mere">+</button>
    </div>
  </section>

  <section class="card rep">
    <div class="head"><h2>Mønstergentagelse</h2></div>
    <div class="prog">
      <div class="txt">Pind <strong id="repRow">0</strong> af <strong id="repLen">8</strong> · gentagelse nr. <strong id="repNum">1</strong></div>
      <div class="stitches" id="dots"></div>
      <label class="field">Mønsteret gentages hver <input id="repInput" type="number" min="1" max="200" inputmode="numeric"> pind</label>
    </div>
  </section>

  <section class="card st">
    <div class="head"><h2>Masker</h2></div>
    <div class="count">
      <button class="minus" id="stMinus" aria-label="Én maske mindre">−</button>
      <span class="n" id="st">0</span>
      <button class="plus" id="stPlus" aria-label="Én maske mere">+</button>
    </div>
  </section>

  <section class="card notes">
    <div class="head"><h2>Noter</h2></div>
    <textarea id="notes" aria-label="Noter" placeholder="F.eks. tag ind i hver 6. pind, pind 4,5 mm"></textarea>
  </section>

  <button class="chip ghost" id="delBtn" style="align-self:center">Slet projekt</button>
  <div class="confirm" id="delBox" hidden>
    <p>Slet dette projekt helt?</p>
    <div class="row2"><button class="btn" id="delNo">Nej</button><button class="btn yes" id="delYes">Ja, slet</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const KEY="strikketaeller-v1", TKEY="strikketaeller-tema";
const blank=n=>({name:n,rows:0,rep:8,stitches:0,notes:""});
let state;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.projects&&s.projects.length)return s}catch(e){}
  return {cur:0,projects:[blank("Mit strikketøj")]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
state=load();
const $=id=>document.getElementById(id);
const P=()=>state.projects[state.cur];
const len=p=>Math.max(1,p.rep|0);
const V='<svg class="stitch{c}" viewBox="0 0 18 20"><path d="M3 4 L9 16 L15 4"/></svg>';

function render(){
  const p=P();
  $("proj").innerHTML=state.projects.map((x,i)=>`<option value="${i}">${x.name.replace(/</g,"&lt;")}</option>`).join("");
  $("proj").value=state.cur;
  $("rows").textContent=p.rows||0;
  $("st").textContent=p.stitches||0;
  const L=len(p), r=p.rows||0, pos=r===0?0:((r-1)%L)+1;
  $("repRow").textContent=pos;
  $("repLen").textContent=L;
  $("repNum").textContent=r===0?1:Math.floor((r-1)/L)+1;
  if(document.activeElement!==$("repInput"))$("repInput").value=L;
  $("dots").innerHTML=L<=48?Array.from({length:L},(_,i)=>V.replace("{c}",i<pos?" on":"")).join(""):"";
  if(document.activeElement!==$("notes"))$("notes").value=p.notes||"";
}
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800)}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function done(){save();render()}

// Pind
$("rowPlus").onclick=()=>{const p=P();p.rows=(p.rows||0)+1;
  if(p.rows%len(p)===0){buzz([40,60,40]);toast("Mønster færdig – starter forfra")}else buzz(15);done()};
$("rowMinus").onclick=()=>{const p=P();if((p.rows||0)>0){p.rows--;done()}};
$("resetBtn").onclick=()=>{$("resetBox").hidden=false;$("resetBtn").hidden=true};
$("resetNo").onclick=()=>{$("resetBox").hidden=true;$("resetBtn").hidden=false};
$("resetYes").onclick=()=>{P().rows=0;done();$("resetBox").hidden=true;$("resetBtn").hidden=false;toast("Pinde nulstillet")};

// Mønster
$("repInput").onchange=e=>{P().rep=Math.min(200,Math.max(1,parseInt(e.target.value)||1));done()};

// Masker
$("stPlus").onclick=()=>{const p=P();p.stitches=(p.stitches||0)+1;buzz(10);done()};
$("stMinus").onclick=()=>{const p=P();if((p.stitches||0)>0){p.stitches--;done()}};

// Noter og projekter
$("notes").oninput=e=>{P().notes=e.target.value;save()};
$("proj").onchange=e=>{state.cur=+e.target.value;done()};
$("newBtn").onclick=()=>{$("newBox").hidden=false;$("newName").value="";$("newName").focus()};
$("newCancel").onclick=()=>$("newBox").hidden=true;
$("newOk").onclick=()=>{state.projects.push(blank($("newName").value.trim()||"Nyt projekt"));state.cur=state.projects.length-1;done();$("newBox").hidden=true;toast("Projekt oprettet")};
$("delBtn").onclick=()=>$("delBox").hidden=false;
$("delNo").onclick=()=>$("delBox").hidden=true;
$("delYes").onclick=()=>{state.projects.splice(state.cur,1);if(!state.projects.length)state.projects.push(blank("Mit strikketøj"));state.cur=0;done();$("delBox").hidden=true;toast("Projekt slettet")};

// Lyst / mørkt tema
const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const MOON='<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>';
function isDark(){const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function paintIcon(){$("themeIcon").innerHTML=isDark()?SUN:MOON}
try{const t=localStorage.getItem(TKEY);if(t)document.documentElement.dataset.theme=t}catch(e){}
$("themeBtn").onclick=()=>{const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem(TKEY,t)}catch(e){}paintIcon()};
paintIcon();

// Hold skærmen tændt mens hun strikker
let lock=null;
async function keepAwake(){try{if("wakeLock" in navigator&&document.visibilityState==="visible")lock=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",keepAwake);
document.addEventListener("click",()=>{if(!lock)keepAwake()},{once:true});
render();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>

</body>
</html>
